name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    name: Lo schema si ricostruisce da zero
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: [5432:5432]
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q
    steps:
      - uses: actions/checkout@v4

      # pg_net e pg_cron non esistono su un Postgres nudo. Le righe che le
      # abilitano vengono neutralizzate SOLO qui: i file nel repository
      # restano quelli veri, che su Supabase servono.
      - name: Impalcatura Supabase (auth, storage, vault, ruoli)
        run: $PSQL -f supabase/prova/00_bootstrap.sql

      - name: Migration, in ordine di timestamp
        run: |
          mkdir -p /tmp/mig
          for f in supabase/migrations/*.sql; do
            sed -E 's/^([[:space:]]*)create extension( if not exists)? (pg_net|pg_cron)/\1-- [CI] \3/I' \
              "$f" > "/tmp/mig/$(basename "$f")"
          done
          for f in /tmp/mig/*.sql; do
            echo "--> $(basename "$f")"
            $PSQL -f "$f"
          done

      - name: Dati di riferimento territoriali
        run: $PSQL -f supabase/seed/01_territorio.sql

      - name: Le funzioni admin rispondono
        run: $PSQL -f supabase/prova/99_fumo.sql

      - name: Ogni tabella ha RLS attiva
        run: |
          $PSQL -At -c "
            select 'RLS MANCANTE: '||relname
              from pg_class c join pg_namespace n on n.oid=c.relnamespace
             where n.nspname='public' and c.relkind='r' and not c.relrowsecurity
          " | tee /tmp/rls.txt
          test ! -s /tmp/rls.txt || { echo 'Tabelle senza RLS, vedi sopra'; exit 1; }

      - name: Nessuna funzione admin raggiungibile da anon
        run: |
          $PSQL -At -c "
            select 'ESPOSTA AD ANON: '||p.proname
              from pg_proc p join pg_namespace n on n.oid=p.pronamespace
             where n.nspname='public'
               and p.proname in ('riepilogo_nazionale','metriche_territorio','ddt_nazionali',
                                 'serie_storica_fatturato','metriche_operative',
                                 'composizione_fatturato','puo_leggere_rete')
               and has_function_privilege('anon', p.oid, 'execute')
          " | tee /tmp/anon.txt
          test ! -s /tmp/anon.txt || { echo 'Funzioni admin raggiungibili da anon'; exit 1; }

  frontend:
    name: Il frontend compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Tipi
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://esempio.supabase.co
          VITE_SUPABASE_ANON_KEY: chiave-finta-per-la-build

      - name: Nessun segreto nel codice
        run: |
          if grep -rnE "(service_role|sb_secret_|SUPABASE_SERVICE|sk-[A-Za-z0-9]{20})" src/ ; then
            echo 'Possibile chiave di servizio o API nel frontend'; exit 1
          fi

      - name: Nessun asset esterno residuo
        run: |
          if grep -rn "media.base44.com" src/ ; then
            echo 'Asset serviti da un dominio di terzi: vanno su Supabase Storage'
            exit 1
          fi

      - name: Nessun marchio di terzi nell'interfaccia
        run: |
          # I tre file delle notizie citano la fonte per nome: e' attribuzione,
          # non uso come marchio. Ovunque altro non deve comparire.
          if grep -rniE "coldiretti" src/ --include=*.jsx --include=*.ts \
             | grep -v "src/components/home/NewsSection.jsx" \
             | grep -v "src/components/home/ColdirettiNewsSection.jsx" \
             | grep -v "src/pages/News.jsx" \
             | grep -v "coldiretti\.it" ; then
            echo 'Marchio di terzi nell interfaccia: usare i marchi propri'
            exit 1
          fi
